modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"

[[mods]]
modId = "snappy_blocks"
version = "${version}"
displayName = "${name}"
authors = "${author}"
displayURL = "${homepage}"
description = '''${description}'''
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "snappy_blocks.mixins.json"

[[dependencies.snappy_blocks]]
modId = "minecraft"
type = "required"
versionRange = "[${mc},${mc_next})"
ordering = "NONE"
side = "CLIENT"
